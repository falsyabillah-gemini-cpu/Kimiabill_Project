name: Kimiabill Daily Auto-Video

on:
  schedule:
    # Slot 1 (Super Peak Siang): mulai 11:25 WIB (04:25 UTC) -> otomatis posting tepat 12:00 WIB
    - cron: "25 4 * * *"
    # Slot 2 (Super Peak Malam): mulai 18:25 WIB (11:25 UTC) -> otomatis posting tepat 19:00 WIB
    - cron: "25 11 * * *"
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Mode upload YouTube (public = langsung tayang / draft = Unlisted / dry_run = Drive saja)"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - draft
          - dry_run

permissions:
  contents: write

jobs:
  produce-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation
          pip install -r requirements.txt

      - name: Run Automated Episode Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_multilingual_v2' }}
          PUBLISH_MODE: ${{ inputs.publish_mode || vars.PUBLISH_MODE || 'public' }}
          TARGET_PUBLISH_TIME_WIB: ${{ github.event.schedule == '25 4 * * *' && '12:00' || (github.event.schedule == '25 11 * * *' && '19:00' || '') }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          SOCIAL_BRIDGE_WEBHOOK_URL: ${{ secrets.SOCIAL_BRIDGE_WEBHOOK_URL }}
          SOCIAL_BRIDGE_API_KEY: ${{ secrets.SOCIAL_BRIDGE_API_KEY }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'researchfalsyabillah@gmail.com' }}
          AUTO_UPLOAD_GDRIVE: "true"
        run: |
          python -c "from src.scheduler import run_one_automated_episode; run_one_automated_episode()"

      - name: Save Published Episode History for Weekly Audit
        run: |
          git config user.name "Kimiabill Studio Bot"
          git config user.email "bot@kimiabill.local"
          git add data/published_history.json data/studio_memory.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: record published episode for weekly growth audit [skip ci]" && git push)

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimiabill-episode-${{ github.run_number }}
          path: |
            episodes/*/FINAL_*.mp4
            episodes/*/THUMBNAIL_*.jpg
            episodes/*/CAPTION_SIAP_UPLOAD.txt
            episodes/*/*_contact_sheet.jpg
            episodes/*/handoffs/*.json
