name: Kimiabill Daily Auto-Video

on:
  schedule:
    # Primary cron di menit off-peak (:11) 109 menit sebelum tayang agar antrean GitHub tidak pernah bikin telat >15 menit:
    # Slot 1 (12:00 WIB): primary 10:11 WIB (03:11 UTC) + watchdog cadangan 11:37 WIB (04:37 UTC)
    - cron: "11 3 * * *"
    - cron: "37 4 * * *"
    # Slot 2 (19:00 WIB): primary 17:11 WIB (10:11 UTC) + watchdog cadangan 18:37 WIB (11:37 UTC)
    - cron: "11 10 * * *"
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Mode upload YouTube (public = langsung tayang / draft = Unlisted / dry_run = Drive saja)"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - draft
          - dry_run
      target_publish_time_wib:
        description: "Opsional: tahan upload hingga jam WIB tertentu (mis. 19:00 atau 12:00)"
        required: false
        default: ""
        type: string
      resume_artifact_run_id:
        description: "Opsional: isi GitHub Run ID sebelumnya untuk langsung upload ulang artifact video yang gagal ke YouTube (<1 menit)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

jobs:
  produce-video:
    runs-on: ubuntu-latest
    outputs:
      skip_duplicate: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Guard Against Concurrent or Duplicate Run
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SKIP="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ACTIVE=$(gh run list -R "${{ github.repository }}" --workflow daily_kimiabill.yml --limit 10 --json databaseId,status --jq "[.[] | select((.status == \"in_progress\" or .status == \"queued\") and (.databaseId != ${{ github.run_id }}))] | length")
            if [ "${ACTIVE:-0}" -gt 0 ]; then
              echo "Sudah ada run produksi yang sedang berjalan — watchdog keluar dengan aman tanpa duplikasi."
              SKIP="true"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.guard.outputs.skip != 'true' }}

      - name: Setup Python 3.12
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg & Dependencies
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation
          pip install -r requirements.txt

      - name: Rescue Upload from Existing Artifact (Optional)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.resume_artifact_run_id != '' }}
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MODE: ${{ inputs.publish_mode || vars.PUBLISH_MODE || 'public' }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'researchfalsyabillah@gmail.com' }}
          AUTO_UPLOAD_GDRIVE: "true"
        run: |
          mkdir -p _rescue_art episodes
          gh run download "${{ inputs.resume_artifact_run_id }}" -D _rescue_art
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from src.pipeline import run_upload
          from src.state import EpisodeState

          art_root = Path("_rescue_art")
          mp4 = next(art_root.rglob("FINAL_*.mp4"))
          src_dir = mp4.parent
          # Detect episode_id from folder name or latest un-uploaded published_history entry
          ep_id = src_dir.name if src_dir.name.startswith("ep_") else ""
          if not ep_id:
              hist_p = Path("data/published_history.json")
              if hist_p.exists():
                  hist = json.loads(hist_p.read_text(encoding="utf-8"))
                  for row in reversed(hist):
                      if not row.get("youtube_url") and row.get("episode_id"):
                          ep_id = row["episode_id"]
                          break
          if not ep_id:
              ep_id = f"ep_rescue_{os.environ.get('GITHUB_RUN_ID', 'manual')}"

          ep_dir = Path("episodes") / ep_id
          ep_dir.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src_dir, ep_dir, dirs_exist_ok=True)
          print(f"[rescue] Memproses episode {ep_id} ({mp4.name}, {mp4.stat().st_size / (1024*1024):.1f} MB)...")

          st_path = ep_dir / "episode_state.json"
          if not st_path.exists():
              hf_dir = ep_dir / "handoffs"
              a3_p = hf_dir / "agent3_script.json"
              a5_files = sorted(hf_dir.glob("agent5_audit_v*.json")) if hf_dir.exists() else []
              a7_p = hf_dir / "agent7_package.json"
              a3 = json.loads(a3_p.read_text(encoding="utf-8")) if a3_p.exists() else None
              a5_list = [json.loads(a5_files[-1].read_text(encoding="utf-8"))] if a5_files else []
              a7 = json.loads(a7_p.read_text(encoding="utf-8")) if a7_p.exists() else None
              st = EpisodeState(episode_id=ep_id, status="rendered_final", agent3=a3, agent5_history=a5_list, agent7=a7)
              st_path.write_text(st.model_dump_json(indent=2), encoding="utf-8")

          state = run_upload(ep_id, allow_youtube=True, qa_summary="Rescue Upload Video Lolos QA (Auto-Compress <34MB)")
          shutil.rmtree(art_root, ignore_errors=True)
          if not state.youtube_url:
              raise SystemExit(f"Rescue upload gagal: youtube_url kosong (Drive: {state.gdrive_folder_url})")
          print(f"[rescue] Berhasil upload YouTube Shorts: {state.youtube_url}")
          PY

      - name: Run Automated Episode Pipeline
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.resume_artifact_run_id == '' }}
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_multilingual_v2' }}
          PUBLISH_MODE: ${{ inputs.publish_mode || vars.PUBLISH_MODE || 'public' }}
          TARGET_PUBLISH_TIME_WIB: ${{ inputs.target_publish_time_wib || ((github.event.schedule == '11 3 * * *' || github.event.schedule == '37 4 * * *') && '12:00' || ((github.event.schedule == '11 10 * * *' || github.event.schedule == '37 11 * * *') && '19:00' || '')) }}
          SKIP_IF_SLOT_PUBLISHED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          SOCIAL_BRIDGE_WEBHOOK_URL: ${{ secrets.SOCIAL_BRIDGE_WEBHOOK_URL }}
          SOCIAL_BRIDGE_API_KEY: ${{ secrets.SOCIAL_BRIDGE_API_KEY }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'researchfalsyabillah@gmail.com' }}
          AUTO_UPLOAD_GDRIVE: "true"
        run: |
          python -c "from src.scheduler import run_one_automated_episode; run_one_automated_episode()"

      - name: Save Published Episode History for Weekly Audit
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          git config user.name "Kimiabill Studio Bot"
          git config user.email "bot@kimiabill.local"
          git add data/published_history.json data/audience_requests.json data/memory.db 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: record published episode for weekly growth audit [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      - name: Upload Rendered Video Artifact
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kimiabill-episode-${{ github.run_number }}
          path: |
            episodes/*/FINAL_*.mp4
            episodes/*/THUMBNAIL_*.jpg
            episodes/*/CAPTION_SIAP_UPLOAD.txt
            episodes/*/*_contact_sheet.jpg
            episodes/*/handoffs/*.json
