name: Kimiabill Daily Auto-Video

on:
  schedule:
    # 17:00 WIB (10:00 UTC): produksi draft unlisted agar owner punya >= 90 menit audit manual sebelum 18:30 WIB
    - cron: "0 10 * * *"
  repository_dispatch:
    types: [telegram_feedback, telegram_rerender, telegram_reject_next]
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Mode upload YouTube (draft = Unlisted + Audit Telegram | public = langsung tayang | dry_run = Drive saja)"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - public
          - dry_run
      target_publish_time_wib:
        description: "Target jam tayang WIB (default 18:30)"
        required: false
        default: "18:30"
        type: string
      resume_artifact_run_id:
        description: "Opsional: isi GitHub Run ID sebelumnya untuk langsung upload ulang artifact video yang gagal ke YouTube (<1 menit)"
        required: false
        default: ""
        type: string
      owner_feedback:
        description: "Opsional: masukan khusus owner untuk episode kali ini (Pola B / render ulang)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

jobs:
  produce-video:
    runs-on: ubuntu-latest
    outputs:
      skip_duplicate: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Guard Against Concurrent or Duplicate Run
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SKIP="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ACTIVE=$(gh run list -R "${{ github.repository }}" --workflow daily_kimiabill.yml --limit 10 --json databaseId,status --jq "[.[] | select((.status == \"in_progress\" or .status == \"queued\") and (.databaseId != ${{ github.run_id }}))] | length")
            if [ "${ACTIVE:-0}" -gt 0 ]; then
              echo "Sudah ada run produksi yang sedang berjalan — watchdog keluar dengan aman tanpa duplikasi."
              SKIP="true"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: ${{ steps.guard.outputs.skip != 'true' }}

      - name: Setup Python 3.12 (Cached)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Compile & Apply Telegram Feedback Directly to All Agents (Next Video Mode)
        if: ${{ steps.guard.outputs.skip != 'true' && github.event_name == 'repository_dispatch' && github.event.action == 'telegram_feedback' }}
        env:
          FB_TEXT: ${{ github.event.client_payload.text || github.event.client_payload.feedback || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pip install -q -r requirements.txt
          python - <<'PY'
          import os
          from src.tools.telegram_notify import handle_telegram_dispatch_feedback

          txt = os.environ.get("FB_TEXT", "").strip()
          if txt:
              res = handle_telegram_dispatch_feedback(txt, mode="next_video")
              print(f"[telegram] Kompilasi masukan ke seluruh Agent & Engine: {res}")
          PY
          git config user.name "Kimiabill Studio Bot"
          git config user.email "bot@kimiabill.local"
          git add data/owner_feedback.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git commit -m "chore: compile owner Telegram feedback to Agents 1-8 & engine [skip ci]"
            git pull --rebase origin "$BRANCH" || true
            git push
          fi

      - name: Install FFmpeg & Python Dependencies
        if: ${{ steps.guard.outputs.skip != 'true' && !(github.event_name == 'repository_dispatch' && github.event.action == 'telegram_feedback') }}
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! fc-list | grep -qi "DejaVuSans-Bold"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation
          fi
          pip install -q -r requirements.txt

      - name: Rescue Upload from Existing Artifact (Optional)
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.resume_artifact_run_id != '' && !(github.event_name == 'repository_dispatch' && github.event.action == 'telegram_feedback') }}
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MODE: ${{ inputs.publish_mode || vars.PUBLISH_MODE || 'draft' }}
          PUBLISH_TIME_WIB: ${{ inputs.target_publish_time_wib || vars.PUBLISH_TIME_WIB || '18:30' }}
          AUDIT_LEAD_MINUTES: "90"
          ENABLE_AI_FALLBACK_AUDIT: "true"
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'researchfalsyabillah@gmail.com' }}
          NOTIFY_EMAIL_ALSO: ${{ vars.NOTIFY_EMAIL_ALSO || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_UPLOAD_GDRIVE: "true"
        run: |
          mkdir -p _rescue_art episodes
          gh run download "${{ inputs.resume_artifact_run_id }}" -D _rescue_art
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from src.pipeline import run_upload
          from src.state import EpisodeState
          from src.tools.review_manager import compute_target_publish_iso, send_audit_review_message

          art_root = Path("_rescue_art")
          mp4 = next(art_root.rglob("FINAL_*.mp4"))
          src_dir = mp4.parent
          ep_id = src_dir.name if src_dir.name.startswith("ep_") else ""
          if not ep_id:
              hist_p = Path("data/published_history.json")
              if hist_p.exists():
                  hist = json.loads(hist_p.read_text(encoding="utf-8"))
                  for row in reversed(hist):
                      if not row.get("youtube_url") and row.get("episode_id"):
                          ep_id = row["episode_id"]
                          break
          if not ep_id:
              ep_id = f"ep_rescue_{os.environ.get('GITHUB_RUN_ID', 'manual')}"

          ep_dir = Path("episodes") / ep_id
          ep_dir.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src_dir, ep_dir, dirs_exist_ok=True)
          print(f"[rescue] Memproses episode {ep_id} ({mp4.name}, {mp4.stat().st_size / (1024*1024):.1f} MB)...")

          st_path = ep_dir / "episode_state.json"
          if not st_path.exists():
              hf_dir = ep_dir / "handoffs"
              a3_p = hf_dir / "agent3_script.json"
              a5_files = sorted(hf_dir.glob("agent5_audit_v*.json")) if hf_dir.exists() else []
              a7_p = hf_dir / "agent7_package.json"
              a3 = json.loads(a3_p.read_text(encoding="utf-8")) if a3_p.exists() else None
              a5_list = [json.loads(a5_files[-1].read_text(encoding="utf-8"))] if a5_files else []
              a7 = json.loads(a7_p.read_text(encoding="utf-8")) if a7_p.exists() else None
              st = EpisodeState(episode_id=ep_id, status="rendered_final", agent3=a3, agent5_history=a5_list, agent7=a7)
              st_path.write_text(st.model_dump_json(indent=2), encoding="utf-8")

          pub_mode = os.environ.get("PUBLISH_MODE", "draft").strip().lower()
          state = run_upload(
              ep_id,
              allow_youtube=True,
              qa_summary="Rescue Upload Video Lolos QA (Auto-Compress <34MB)",
              send_basic_telegram_summary=(pub_mode == "public"),
          )
          if not state.youtube_url:
              raise SystemExit(f"Rescue upload gagal: youtube_url kosong (Drive: {state.gdrive_folder_url})")
          if pub_mode == "draft":
              res_mp4 = ep_dir / mp4.name
              send_audit_review_message(state, res_mp4, qa_summary="Rescue Upload Draft", target_publish_iso=compute_target_publish_iso())
          shutil.rmtree(art_root, ignore_errors=True)
          print(f"[rescue] Berhasil upload YouTube Shorts: {state.youtube_url}")
          PY

      - name: Run Telegram Rerender or Reject-and-New-Topic Action
        if: ${{ steps.guard.outputs.skip != 'true' && github.event_name == 'repository_dispatch' && (github.event.action == 'telegram_rerender' || github.event.action == 'telegram_reject_next') }}
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PUBLISH_MODE: "draft"
          PUBLISH_TIME_WIB: ${{ vars.PUBLISH_TIME_WIB || '18:30' }}
          TARGET_PUBLISH_TIME_WIB: ${{ vars.PUBLISH_TIME_WIB || '18:30' }}
          AUDIT_LEAD_MINUTES: "90"
          ENABLE_AI_FALLBACK_AUDIT: "true"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISPATCH_ACTION: ${{ github.event.action }}
          EPISODE_ID_OVERRIDE: ${{ github.event.client_payload.episode_id || '' }}
          OWNER_FEEDBACK_OVERRIDE: ${{ github.event.client_payload.feedback || github.event.client_payload.text || '' }}
          AUTO_UPLOAD_GDRIVE: "true"
        run: |
          python - <<'PY'
          import json, os
          from src.tools.review_manager import handle_telegram_reject_next, handle_telegram_rerender

          act = os.environ.get("DISPATCH_ACTION", "")
          ep_id = os.environ.get("EPISODE_ID_OVERRIDE", "").strip()
          fb = os.environ.get("OWNER_FEEDBACK_OVERRIDE", "").strip()
          if act == "telegram_reject_next":
              res = handle_telegram_reject_next(ep_id)
          else:
              res = handle_telegram_rerender(ep_id, feedback=fb)
          print(f"[telegram_dispatch] {act}: {json.dumps(res, ensure_ascii=False)}")
          PY

      - name: Run Automated Episode Pipeline
        if: ${{ steps.guard.outputs.skip != 'true' && inputs.resume_artifact_run_id == '' && github.event_name != 'repository_dispatch' }}
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PUBLISH_MODE: ${{ inputs.publish_mode || vars.PUBLISH_MODE || 'draft' }}
          PUBLISH_TIME_WIB: ${{ inputs.target_publish_time_wib || vars.PUBLISH_TIME_WIB || '18:30' }}
          TARGET_PUBLISH_TIME_WIB: ${{ inputs.target_publish_time_wib || vars.PUBLISH_TIME_WIB || '18:30' }}
          AUDIT_LEAD_MINUTES: "90"
          ENABLE_AI_FALLBACK_AUDIT: "true"
          SKIP_IF_SLOT_PUBLISHED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          SOCIAL_BRIDGE_WEBHOOK_URL: ${{ secrets.SOCIAL_BRIDGE_WEBHOOK_URL }}
          SOCIAL_BRIDGE_API_KEY: ${{ secrets.SOCIAL_BRIDGE_API_KEY }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'researchfalsyabillah@gmail.com' }}
          NOTIFY_EMAIL_ALSO: ${{ vars.NOTIFY_EMAIL_ALSO || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OWNER_FEEDBACK_OVERRIDE: ${{ github.event.inputs.owner_feedback || '' }}
          AUTO_UPLOAD_GDRIVE: "true"
        run: |
          if [ -n "$OWNER_FEEDBACK_OVERRIDE" ]; then
            python -c "import os; from src.tools.telegram_notify import record_owner_feedback; record_owner_feedback(os.environ['OWNER_FEEDBACK_OVERRIDE'], mode='rerender')"
          fi
          python -c "from src.scheduler import run_one_automated_episode; run_one_automated_episode()"

      - name: Save Pipeline State, History & Pending Review
        if: ${{ steps.guard.outputs.skip != 'true' && !(github.event_name == 'repository_dispatch' && github.event.action == 'telegram_feedback') }}
        run: |
          git config user.name "Kimiabill Studio Bot"
          git config user.email "bot@kimiabill.local"
          git add data/published_history.json data/pending_review.json data/rejected_topics.json data/audience_requests.json data/memory.db data/owner_feedback.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git commit -m "chore: update pipeline state & audit queue [skip ci]"
            git pull --rebase origin "$BRANCH" || true
            git push
          fi

      - name: Upload Rendered Video Artifact
        if: ${{ steps.guard.outputs.skip != 'true' && !(github.event_name == 'repository_dispatch' && github.event.action == 'telegram_feedback') }}
        uses: actions/upload-artifact@v7
        with:
          name: kimiabill-episode-${{ github.run_number }}
          path: |
            episodes/*/FINAL_*.mp4
            episodes/*/THUMBNAIL_*.jpg
            episodes/*/CAPTION_SIAP_UPLOAD.txt
            episodes/*/*_contact_sheet.jpg
            episodes/*/handoffs/*.json
          if-no-files-found: ignore
