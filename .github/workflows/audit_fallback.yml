name: Kimiabill Audit Reminder & AI Chief Editor Fallback

on:
  schedule:
    # Slot Siang (target tayang 12:00 WIB):
    - cron: "30 4 * * *"   # 11:30 WIB: Pengingat Audit jika belum direspons
    - cron: "45 4 * * *"   # 11:45 WIB: AI Chief Editor Blind Audit Fallback
    # Slot Malam (target tayang 19:00 WIB):
    - cron: "30 11 * * *"  # 18:30 WIB: Pengingat Audit jika belum direspons
    - cron: "45 11 * * *"  # 18:45 WIB: AI Chief Editor Blind Audit Fallback
  repository_dispatch:
    types: [telegram_approve, telegram_ai_audit, telegram_save_backup, telegram_reject_use_backup]
  workflow_dispatch:
    inputs:
      action:
        description: "Aksi audit (ai_audit / approve / reminder / save_backup / reject_use_backup)"
        required: false
        default: "ai_audit"
        type: choice
        options:
          - ai_audit
          - approve
          - reminder
          - save_backup
          - reject_use_backup
      episode_id:
        description: "Opsional: Episode ID spesifik (kosong = draft aktif terbaru)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

jobs:
  audit-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12 (Cached)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install FFmpeg & Fonts (AI Audit Only)
        if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '45 4 * * *' || github.event.schedule == '45 11 * * *')) || (github.event_name == 'repository_dispatch' && github.event.action == 'telegram_ai_audit') || (github.event_name == 'workflow_dispatch' && (inputs.action == 'ai_audit' || inputs.action == '')) }}
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! fc-list | grep -qi "DejaVuSans-Bold"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation
          fi

      - name: Install Python Dependencies
        run: pip install -q -r requirements.txt

      - name: Execute Audit Action or AI Chief Editor Fallback
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_TIME_WIB: ${{ (github.event.schedule == '30 4 * * *' || github.event.schedule == '45 4 * * *') && '12:00' || ((github.event.schedule == '30 11 * * *' || github.event.schedule == '45 11 * * *') && '19:00') || vars.PUBLISH_TIME_WIB || '' }}
          ENABLE_AI_FALLBACK_AUDIT: "true"
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          CRON_EXPR: ${{ github.event.schedule || '' }}
          DISPATCH_ACTION: ${{ inputs.action || '' }}
          EPISODE_ID: ${{ github.event.client_payload.episode_id || inputs.episode_id || '' }}
        run: |
          python - <<'PY'
          import json, os
          from src.chief_editor_audit import run_chief_editor_audit
          from src.tools.review_manager import (
              handle_telegram_approve,
              handle_telegram_reject_use_backup,
              handle_telegram_save_backup,
              send_pending_review_reminder,
          )

          ev = os.environ.get("EVENT_NAME", "")
          ev_action = os.environ.get("EVENT_ACTION", "")
          cron = os.environ.get("CRON_EXPR", "")
          manual_action = os.environ.get("DISPATCH_ACTION", "ai_audit")
          ep_id = os.environ.get("EPISODE_ID", "").strip()

          if (ev == "schedule" and cron in ("30 4 * * *", "30 11 * * *")) or (ev == "workflow_dispatch" and manual_action == "reminder"):
              res = send_pending_review_reminder()
          elif (ev == "repository_dispatch" and ev_action == "telegram_approve") or (ev == "workflow_dispatch" and manual_action == "approve"):
              res = handle_telegram_approve(ep_id, by_ai=False)
          elif (ev == "repository_dispatch" and ev_action == "telegram_save_backup") or (ev == "workflow_dispatch" and manual_action == "save_backup"):
              res = handle_telegram_save_backup(ep_id)
          elif (ev == "repository_dispatch" and ev_action == "telegram_reject_use_backup") or (ev == "workflow_dispatch" and manual_action == "reject_use_backup"):
              res = handle_telegram_reject_use_backup(ep_id)
          else:
              force = (ev != "schedule")
              res = run_chief_editor_audit(ep_id, force=force)
          print("[audit_fallback]", json.dumps(res, ensure_ascii=False))
          PY

      - name: Commit Updated Audit & Published History State
        run: |
          git config user.name "Kimiabill Audit Bot"
          git config user.email "bot@kimiabill.local"
          git add data/pending_review.json data/published_history.json data/rejected_topics.json data/backup_queue.json data/audience_requests.json data/memory.db data/owner_feedback.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git commit -m "chore: update audit decision & published history [skip ci]"
            git pull --rebase origin "$BRANCH" || true
            git push
          fi
