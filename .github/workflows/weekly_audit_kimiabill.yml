name: Kimiabill Weekly Social Media Audit (Agent 8)

on:
  schedule:
    # Setiap hari Minggu jam 20:00 WIB (13:00 UTC) — 1 jam setelah video Minggu jam 19:00 WIB ter-upload
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode jalankan: full_weekly_audit atau send_flow_prompts_email"
        required: false
        default: "full_weekly_audit"
        type: choice
        options:
          - full_weekly_audit
          - send_flow_prompts_email

permissions:
  contents: write
  actions: read

jobs:
  weekly-growth-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          pip install -q -r requirements.txt

      - name: Run Agent 8 Weekly Audit or Send Google AI Flow Prompts Email
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
          GDRIVE_WEBHOOK_TOKEN: ${{ secrets.GDRIVE_WEBHOOK_TOKEN }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'researchfalsyabillah@gmail.com' }}
          NOTIFY_EMAIL_ALSO: ${{ vars.NOTIFY_EMAIL_ALSO || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FLOW_CREDITS_REMAINING: ${{ vars.FLOW_CREDITS_REMAINING || '' }}
          AUDIT_DISPATCH_MODE: ${{ github.event.inputs.mode || 'full_weekly_audit' }}
        run: |
          if [ "$AUDIT_DISPATCH_MODE" = "send_flow_prompts_email" ]; then
            python -c "from src.tools.weekly_growth_auditor import send_flow_prompts_and_guide_email; res = send_flow_prompts_and_guide_email(); assert res.get('emailed_to') or res.get('telegram_sent'), f'Notifikasi gagal terkirim: {res}'"
          else
            python -c "from src.tools.weekly_growth_auditor import run_agent_8_weekly_audit; run_agent_8_weekly_audit()"
          fi

      - name: Commit Updated Cross-Agent Directives
        run: |
          git config user.name "Kimiabill Studio Bot"
          git config user.email "bot@kimiabill.local"
          git add data/weekly_agent_directives.json data/mechanism_bank.json data/weekly_audits/ data/audience_requests.json data/memory.db data/KIMIABILL_MASTER_DATABASE.csv data/published_history.json data/FLOW_PROMPTS_LATEST.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git commit -m "chore: Agent 8 weekly engagement audit & agent directives [skip ci]"
            git pull --rebase origin "$BRANCH" || true
            git push
          fi
