brand:
  name: "Kimiabill"
  handle: "@kimiabill"
  language: "id"
  niche: "Fenomena sains murni (Kimia, Fisika, Matematika, Medisinal, Biologi) yang dikemas mudah, menarik, dan bisa dimengerti semua orang"
  disciplines:
    - "kimia"
    - "fisika"
    - "matematika"
    - "medisinal"
    - "biologi"
  ideation_policy:
    viral_first: true
    viral_lookback_hours: 72
    min_viral_matches: 2
    fallback_source: "data/idea_bank.json"
    balance_disciplines: true
  audience: "Umum (pelajar, mahasiswa, dan masyarakat awam yang penasaran dengan sains murni)"
  tone:
    - "Ceria, ramah, antusias, tidak menggurui"
    - "Bahasa Indonesia sehari-hari yang jelas dan natural"
    - "Hindari jargon rumit tanpa analogi sederhana"

video:
  format: "9:16"
  proxy_resolution: [480, 854]
  proxy_fps: 15
  final_resolution: [1080, 1920]
  final_fps: 30
  target_duration_sec: [32, 55]
  visual_policy:
    real_footage_only: true
    no_full_animation: true
    mechanistic_overlay: true
    overlay_style: "comic_science_hybrid"
    overlay_policy: "Real footage sebagai dasar + layer animasi mekanistik 30fps berbingkai tegas untuk menggambarkan proses sains secara nyata"
  mascot:
    enabled: true
    style: "option_b_duo"
    assets_dir: "assets/mascots"
    poses: ["curious", "explain", "celebrate"]
  safe_zone:
    top_margin_pct: 12
    bottom_margin_pct: 22
    side_margin_pct: 7

voice:
  engine: "edge_tts"
  voice_name: "id-ID-ArdiNeural"
  style_notes: "Suara laki-laki ceria, intonasi jelas, pelafalan tegas, pace sedang agar mudah diikuti"
  rate: "+2%"
  pitch: "+4Hz"
  target_wpm: [135, 160]

audio_mix:
  voice_lufs: -15.0
  sfx_gain_db: -10.0
  bgm_gain_db: -24.0

publishing:
  default_mode: "public"   # "dry_run" | "draft" (YouTube Unlisted) | "public" (langsung tayang)
  platforms:
    - "youtube_shorts"
    # Aktifkan nanti saat sudah siap:
    # - "tiktok"
    # - "instagram_reels"
  generate_thumbnail: true

guardrails:
  max_revisions: 4
  max_topic_attempts: 3
  min_idea_score: 7.5
  min_qa_score: 8.0
