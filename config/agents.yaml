# Konfigurasi routing model untuk 7 Agent Kimiabill_videos.
# Mode default: "production" dengan provider "auto" — otomatis memakai API key yang tersedia di .env / Secrets:
#   1. GEMINI_API_KEY     -> gemini_api (gemini-3.5-flash-lite)
#   2. ANTHROPIC_API_KEY  -> anthropic_api (claude-sonnet-4-5)
#   3. OPENROUTER_API_KEY -> openrouter (google/gemini-3.5-flash-lite)
# Anda tetap dapat memilih provider spesifik per agent:
# - "auto" | "gemini_api" | "anthropic_api" | "claude_code_cli" | "openrouter" | "antigravity_local"

runtime_mode: "production"

agents:
  agent_1_ideation:
    role: "Viral Pure-Science Trend Scout & Ideation"
    provider: "auto"
    recommended_prod_provider: "gemini_api"
    recommended_prod_model: "gemini-3.5-flash-lite"

  agent_2_editorial_auditor:
    role: "Hook & Editorial Auditor"
    provider: "auto"
    recommended_prod_provider: "gemini_api"
    recommended_prod_model: "gemini-3.5-flash-lite"

  agent_3_script_reviser:
    role: "Script, Shot-List & Mechanistic Storyboard Reviser"
    provider: "auto"
    recommended_prod_provider: "gemini_api"
    recommended_prod_model: "gemini-3.5-flash-lite"

  agent_6_asset_scout:
    role: "Real Footage & SFX Scout"
    provider: "auto"
    recommended_prod_provider: "gemini_api"
    recommended_prod_model: "gemini-3.5-flash-lite"
    footage_sources:
      - "pexels"           # otomatis aktif jika PEXELS_API_KEY diisi
      - "wikimedia"        # gratis tanpa API key, banyak video sains nyata (CC0/CC-BY)
      - "archive_org"      # gratis tanpa API key, video edukasi/eksperimen nyata

  agent_4_video_executor:
    role: "Video Director, Mechanistic Animator & FFmpeg Renderer"
    provider: "auto"
    recommended_prod_provider: "gemini_api"
    recommended_prod_model: "gemini-3.5-flash-lite"

  agent_5_video_qa:
    role: "Multimodal Video QA Auditor"
    provider: "auto"
    recommended_prod_provider: "gemini_api"
    recommended_prod_model: "gemini-3.5-flash-lite"

  agent_7_publisher:
    role: "Packaging (Thumbnail + SEO Caption) & Multi-Platform Social Publisher"
    provider: "auto"
    recommended_prod_provider: "gemini_api"
    recommended_prod_model: "gemini-3.5-flash-lite"
    platforms:
      - "youtube_shorts"
      # Aktifkan nanti saat sudah siap:
      # - "tiktok"
      # - "instagram_reels"

  agent_8_growth_auditor:
    role: "Weekly Social Media Engagement & Cross-Agent Growth Auditor (Every Sunday 20:00 WIB)"
    provider: "auto"
    recommended_prod_provider: "gemini_api"
    recommended_prod_model: "gemini-3.5-flash-lite"
